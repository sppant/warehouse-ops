services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse_ops
      POSTGRES_USER: warehouse_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_app -d warehouse_ops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    image: ${API_IMAGE:-warehouse-ops-api:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://warehouse_app:${POSTGRES_PASSWORD}@db:5432/warehouse_ops
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - backend

  migrate:
    image: ${MIGRATE_IMAGE:-warehouse-ops-migrate:latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://warehouse_app:${POSTGRES_PASSWORD}@db:5432/warehouse_ops
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  web:
    image: ${WEB_IMAGE:-warehouse-ops-web:latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
