name: Web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -w apps/web

      - name: Unit tests
        run: npm test -w apps/web

      - name: Build
        run: npm run build -w apps/web
