name: API

on:
  pull_request:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: warehouse_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build -w apps/api

      # Fails if apps/api/openapi.json no longer matches the code. Fix with
      # `npm run openapi:generate -w apps/api` and commit the result.
      - name: Check OpenAPI spec is up to date
        run: npm run openapi:check -w apps/api

      - name: Unit tests
        run: npm test -w apps/api
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/unused

      - name: Run migrations on test database
        run: npm run db:migrate -w apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/warehouse_ops_test

      - name: Integration tests
        run: npm run test:integration -w apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/warehouse_ops
