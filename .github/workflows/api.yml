name: API

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build -w apps/api

      - name: Unit tests
        run: npm test -w apps/api
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/unused
